<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<style>
html,body{margin:0;height:100%;font:13px system-ui;color:#eaf7ff;background:#071725}#view{position:relative;height:460px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at center,#183f59,#071725 72%)}canvas{display:block;touch-action:none;outline-offset:-3px}canvas:focus-visible,button:focus-visible{outline:3px solid #67c8f5}#tip{position:absolute;z-index:3;pointer-events:none;max-width:220px;background:#102d43;color:#effaff;border:1px solid #67c8f5;border-radius:8px;padding:7px 9px;box-shadow:0 3px 12px #0008;display:none;white-space:normal}#tools{position:absolute;top:12px;right:12px;display:flex;gap:5px}button{border:1px solid #63879e;border-radius:7px;background:#102d43;color:white;padding:7px 10px;cursor:pointer}#hint{position:absolute;bottom:10px;left:12px;right:12px;font-size:11px;color:#d5ecf9;background:#071725b8;padding:6px 8px;border-radius:6px;pointer-events:none}#error{padding:20px;display:none;color:white}
</style></head><body><div id="view"><div id="error"></div><div id="tip" role="status"></div><div id="tools"><button id="in" aria-label="Zoom in">+</button><button id="out" aria-label="Zoom out">−</button><button id="reset" aria-label="Reset view">↺</button></div><div id="hint"></div></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from './OrbitControls.js';
const view=document.getElementById('view'),tip=document.getElementById('tip');let args={},signature='',markers=[],camera,renderer,controls,scene,earth,selected;
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const vector=(lat,lon,r=1)=>new THREE.Vector3(Math.cos(lat*Math.PI/180)*Math.cos(lon*Math.PI/180),Math.sin(lat*Math.PI/180),-Math.cos(lat*Math.PI/180)*Math.sin(lon*Math.PI/180)).multiplyScalar(r);
function reset(){
 const halfAngle=Math.atan(Math.tan(camera.fov*Math.PI/360)*Math.min(1,camera.aspect));
 const distance=Math.min(5.5,Math.max(3.7,1.12/Math.sin(halfAngle)));
 camera.position.copy(vector(args.lat||0,args.lon||0,distance));controls.target.set(0,0,0);controls.update();
}

try{
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(35,1,.1,100);
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
 view.prepend(renderer.domElement);renderer.domElement.tabIndex=0;renderer.domElement.setAttribute('aria-label','Interactive Earth globe');
 controls=new OrbitControls(camera,renderer.domElement);controls.enablePan=false;controls.enableDamping=true;controls.minDistance=1.35;controls.maxDistance=5.5;controls.rotateSpeed=.65;controls.zoomSpeed=.7;controls.addEventListener('start',()=>tip.style.display='none');
 const texture=new THREE.TextureLoader().load('./earth.jpg',undefined,undefined,()=>{document.getElementById('error').textContent=args.error||'Earth texture unavailable. Use the coordinate fields.';document.getElementById('error').style.display='block';});texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
 earth=new THREE.Mesh(new THREE.SphereGeometry(1,96,64),new THREE.MeshPhongMaterial({map:texture,shininess:5,specular:0x243747}));scene.add(earth);
 scene.add(new THREE.AmbientLight(0xffffff,2.1));let sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(3,2,4);camera.add(sun);scene.add(camera);
 // Thin atmospheric rim; it is decorative, never a data layer.
 const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(1.013,64,48),new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.BackSide,uniforms:{},vertexShader:'varying vec3 n;varying vec3 v;void main(){vec4 p=modelViewMatrix*vec4(position,1.);n=normalize(normalMatrix*normal);v=normalize(-p.xyz);gl_Position=projectionMatrix*p;}',fragmentShader:'varying vec3 n;varying vec3 v;void main(){float a=pow(1.-abs(dot(n,v)),3.);gl_FragColor=vec4(.25,.65,1.,a*.35);}'}));scene.add(atmosphere);
 selected=new THREE.Mesh(new THREE.SphereGeometry(.018,16,12),new THREE.MeshBasicMaterial({color:0xffce73}));scene.add(selected);
 const resize=()=>{const w=view.clientWidth;camera.aspect=w/460;camera.updateProjectionMatrix();renderer.setSize(w,460);};new ResizeObserver(resize).observe(view);resize();
 const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down;
 function pick(e){const rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height)*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObject(earth);if(!hits.length)return null;const p=hits[0].point.clone().normalize();let item={lat:Math.asin(p.y)*180/Math.PI,lon:Math.atan2(-p.z,p.x)*180/Math.PI};const mh=ray.intersectObjects(markers)[0];if(mh&&mh.distance<hits[0].distance+.04)item={...mh.object.userData};return item;}
 renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
 renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)return;const p=pick(e);if(p&&Math.abs(p.lat)<=84)send('streamlit:setComponentValue',{value:{...p,sequence:Date.now()},dataType:'json'});});
 renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons){tip.style.display='none';return;}const p=pick(e);if(!p){tip.style.display='none';return;}tip.textContent=p.name||`${p.lat.toFixed(2)}°, ${p.lon.toFixed(2)}°`;tip.style.display='block';tip.style.left=Math.min(e.offsetX+12,Math.max(4,view.clientWidth-230))+'px';tip.style.top=Math.max(8,Math.min(e.offsetY+12,380))+'px';});
 renderer.domElement.addEventListener('pointerleave',()=>tip.style.display='none');
 const zoom=f=>{camera.position.multiplyScalar(f).clampLength(1.35,5.5);controls.update();};document.getElementById('in').onclick=()=>zoom(.85);document.getElementById('out').onclick=()=>zoom(1.15);document.getElementById('reset').onclick=reset;
 renderer.domElement.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-'].includes(e.key)){e.preventDefault();if(e.key==='+')zoom(.85);else if(e.key==='-')zoom(1.15);else{const p=camera.position;const s=new THREE.Spherical().setFromVector3(p);s.theta+=(e.key==='ArrowLeft'?.08:e.key==='ArrowRight'?-.08:0);s.phi+=(e.key==='ArrowUp'?-.08:e.key==='ArrowDown'?.08:0);s.makeSafe();p.setFromSpherical(s);controls.update();}}});
 renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
}catch(error){document.getElementById('error').textContent='3D view unavailable. Use the coordinate fields.';document.getElementById('error').style.display='block';}
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;document.getElementById('hint').textContent=args.hint||'';send('streamlit:setFrameHeight',{height:460});if(!renderer)return;
 const next=JSON.stringify([args.lat,args.lon,args.markers]);if(next!==signature){for(const m of markers){scene.remove(m);m.geometry.dispose();m.material.dispose();}markers=(args.markers||[]).map(item=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.013,12,10),new THREE.MeshBasicMaterial({color:0x67c8f5}));m.position.copy(vector(item.lat,item.lon,1.016));m.userData=item;scene.add(m);return m;});selected.position.copy(vector(args.lat,args.lon,1.019));reset();signature=next;}
 document.getElementById('in').setAttribute('aria-label',args.zoom_in);document.getElementById('out').setAttribute('aria-label',args.zoom_out);document.getElementById('reset').setAttribute('aria-label',args.reset);renderer.domElement.setAttribute('aria-label',args.label);
});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:460});
</script></body></html>
